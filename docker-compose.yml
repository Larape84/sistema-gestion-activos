services:
  activos-app:
    build: .
    networks:
      - dokploy-network
    deploy:
      labels:
        traefik.enable: "true"
        traefik.http.routers.activos-app.rule: Host(`activos.devscloud.online`)
        traefik.http.routers.activos-app.entrypoints: websecure
        traefik.http.routers.activos-app.tls.certresolver: letsencrypt
        traefik.http.services.activos-app.loadbalancer.server.port: "80"

networks:
  dokploy-network:
    external: true
