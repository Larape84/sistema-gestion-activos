<div class="w-full h-screen bg-red-400 flex flex-col items-center justify-center overflow-hidden">

  <form [formGroup]="formUser" class="w-100 h-100 bg-white rounded-md flex flex-col gap-2 p-2">


    <mat-form-field class="w-full">
      <mat-label>Nombre de usuario</mat-label>
      <input formControlName="user" type="text" autocomplete="off" matInput>
    </mat-form-field>

     <mat-form-field class="w-full">
      <mat-label>Contraseña</mat-label>
      <input formControlName="password" type="text" autocomplete="off" matInput>
    </mat-form-field>

     <mat-form-field class="w-full">
      <mat-label>Confirmar contraseña</mat-label>
      <input formControlName="repeatPass" type="text" autocomplete="off" matInput>
    </mat-form-field>

    <a
                            class="text-md font-medium text-primary-500 hover:underline"
                            [routerLink]="['/login/auth']">¿Ya tiene usuario? inicie sesión
                        </a>

   <button (click)="crearUsuario()" mat-flat-button color="primary" >Crear usuario</button>








  </form>

</div>
