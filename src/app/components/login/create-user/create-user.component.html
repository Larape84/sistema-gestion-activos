<div class="w-full h-screen bg-[#753BBD] flex flex-col items-center justify-center overflow-hidden">

  <form [formGroup]="formUser" class="w-100  bg-white rounded-md px-3 flex flex-col gap-2 p-2">




      <div class="h-[50px] max-h-[50px] mx-auto">
        <img src="assets/images/logo_blanco.jpg" class="w-full h-full object-contain" alt="logo">
      </div>


      <div class="w-full flex items-center gap-2" >
        <span class="font-semibold text-gray-600 text-xl flex-shrink-0">Crear usuario</span>
        <hr class="my-0 w-full mt-2 text-gray-200">
      </div>


      <div class="flex flex-col gap-2">
    <label for="username">Nombre de usuario</label>
    <input  pInputText id="username" autocomplete="off" aria-describedby="username-help" formControlName="user" />
     <small class="font-semibold text-red-500 text-sm" *ngIf="!!errorService.msgError(formUser, 'user')" id="username-help">{{errorService.msgError(formUser, 'user')}}</small>
    </div>


    <!-- <mat-form-field class="w-full">
      <mat-label>Nombre de usuario</mat-label>
      <input formControlName="user" type="text" autocomplete="off" matInput>
    </mat-form-field> -->

     <div class="flex flex-col gap-2 w-full">
    <label for="username">Contraseña</label>

    <p-password fluid   class="w-full" feedback="false" formControlName="password" [toggleMask]="true" />

    <!-- <input pInputText id="username" autocomplete="off" aria-describedby="username-help"  /> -->
     <small class="font-semibold text-red-500 text-sm" *ngIf="!!errorService.msgError(formUser, 'password')" id="username-help">{{errorService.msgError(formUser, 'password')}}</small>
    </div>

     <div class="flex flex-col gap-2 w-full">
    <label for="username">Confirmar contraseña</label>
        <p-password fluid class="w-full" feedback="false" formControlName="repeatPass" [toggleMask]="true" />

    <!-- <input pInputText id="username" autocomplete="off" aria-describedby="username-help" formControlName="repeatPass" /> -->
    <small class="font-semibold text-red-500 text-sm" *ngIf="!!errorService.msgError(formUser, 'repeatPass')" id="username-help">{{errorService.msgError(formUser, 'repeatPass')}}</small>
    </div>



     <!-- <mat-form-field class="w-full">
      <mat-label>Contraseña</mat-label>
      <input formControlName="password" type="password" autocomplete="off" matInput>
    </mat-form-field> -->

     <!-- <mat-form-field class="w-full">
      <mat-label>Confirmar contraseña</mat-label>
      <input  formControlName="repeatPass" type="password" autocomplete="off" matInput>
    </mat-form-field> -->

    <a
                            class="text-md text-purple-700 font-medium text-primary-500 hover:underline"
                            [routerLink]="['/login/auth']">¿Ya tiene usuario? inicie sesión
                        </a>

   <button class="mt-2" (click)="crearUsuario()" mat-flat-button color="primary" >Crear usuario</button>








  </form>

</div>
