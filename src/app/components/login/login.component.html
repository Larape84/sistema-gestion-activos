<div class="w-full h-screen bg-[#753BBD] flex flex-col items-center justify-center overflow-hidden">

  <form [formGroup]="formLogin" class="w-100   bg-white rounded-md px-3 flex flex-col gap-2 p-2">



      <div class="h-[50px] max-h-[50px] mx-auto">
        <img src="assets/images/logo_blanco.jpg" class="w-full h-full object-contain" alt="logo">
      </div>


       <div class="w-full flex items-center gap-2" >
        <span class="font-semibold text-gray-600 text-xl flex-shrink-0">Iniciar sesión</span>
        <hr class="my-0 w-full mt-2 text-gray-200">
      </div>


    <!-- <mat-form-field class="w-full mt-4">
      <mat-label>Usuario</mat-label>
      <input formControlName="user" type="text" autocomplete="off" matInput>
    </mat-form-field> -->

      <div class="flex flex-col gap-2">
    <label for="username">Usuario</label>
    <input  pInputText id="username" autocomplete="off" aria-describedby="username-help" formControlName="user" />
     <small class="font-semibold text-red-500 text-sm" *ngIf="!!errorService.msgError(formLogin, 'user')" id="username-help">{{errorService.msgError(formLogin, 'user')}}</small>
    </div>

     <!-- <mat-form-field class="w-full">
      <mat-label>Contraseña</mat-label>
      <input formControlName="password" type="text" autocomplete="off" matInput>
    </mat-form-field> -->

     <div class="flex flex-col gap-2 w-full">
    <label for="username">Contraseña</label>
        <p-password fluid class="w-full" feedback="false" formControlName="password" [toggleMask]="true" />

    <!-- <input pInputText id="username" autocomplete="off" aria-describedby="username-help" formControlName="repeatPass" /> -->
    <small class="font-semibold text-red-500 text-sm" *ngIf="!!errorService.msgError(formLogin, 'password')" id="username-help">{{errorService.msgError(formLogin, 'password')}}</small>
    </div>

    <a
                            class="text-md text-purple-700 font-medium text-primary-500 hover:underline"
                            [routerLink]="['/login/create-user']">¿Desea crear su usuario?
                        </a>


                        <div class="flex w-full flex-grow-1 items-end" >

                          <button mat-flat-button color="primary" class="w-full" (click)="iniciarSesion()" >Iniciar sesión</button>
                        </div>








  </form>

</div>
