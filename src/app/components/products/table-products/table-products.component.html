
      <div class="w-full rounded-md overflow-hidden border border-solid border-gray-300" >
    <table mat-table [dataSource]="dataSource">

       <ng-container matColumnDef="editar">
        <th mat-header-cell *matHeaderCellDef class="bg-gray-100 "> </th>
        <td mat-cell *matCellDef="let element">

          <div class="w-full flex flex-row items-center">

            <p-button [rounded]="true"
            severity="secondary"
            [text]="true"
            (click)="menu.toggle($event); selectProducto = element"
            icon="pi pi-bars"/>

            <p-menu #menu [model]="items" [popup]="true" />
          </div>


        </td>
      </ng-container>

      <!-- Position Column -->
      <ng-container matColumnDef="Nombre">
        <th mat-header-cell *matHeaderCellDef class="font-bold text-gray-600 bg-gray-100" > Nombre </th>
        <td mat-cell *matCellDef="let element"> {{element.position}} </td>
      </ng-container>

      <!-- Name Column -->
      <ng-container matColumnDef="Categoria">
        <th mat-header-cell *matHeaderCellDef class="bg-gray-100 font-bold text-gray-600"> Categoria </th>
        <td mat-cell *matCellDef="let element"> {{element.name}} </td>
      </ng-container>

      <!-- Weight Column -->
      <ng-container matColumnDef="Area">
        <th mat-header-cell *matHeaderCellDef class="bg-gray-100 font-bold text-gray-600"> Area </th>
        <td mat-cell *matCellDef="let element"> {{element.weight}} </td>
      </ng-container>

      <!-- Symbol Column -->
      <ng-container matColumnDef="Custodio">
        <th mat-header-cell *matHeaderCellDef class="bg-gray-100 font-bold text-gray-600"> Custodio </th>
        <td mat-cell *matCellDef="let element"> {{element.symbol}} </td>
      </ng-container>


       <ng-container matColumnDef="fecha">
        <th mat-header-cell *matHeaderCellDef class="bg-gray-100 font-bold text-gray-600"> Fecha adquisición </th>
        <td mat-cell *matCellDef="let element"> {{element.symbol}} </td>
      </ng-container>

       <ng-container matColumnDef="estado">
        <th mat-header-cell *matHeaderCellDef class="bg-gray-100 font-bold text-gray-600"> Estado </th>
        <td mat-cell *matCellDef="let element"> {{element.symbol}} </td>
      </ng-container>

       <ng-container matColumnDef="Valor">
        <th mat-header-cell *matHeaderCellDef class="bg-gray-100 font-bold text-gray-600"> Valor </th>
        <td mat-cell *matCellDef="let element"> {{element.symbol}} </td>
      </ng-container>

      <tr class="font-semibold text-gray-600" mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <mat-paginator [pageSizeOptions]="[5, 10, 20]"
                   showFirstLastButtons
                   aria-label="Select page of periodic elements">
    </mat-paginator>
  </div>
